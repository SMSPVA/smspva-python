[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smspva-sdk"
version = "0.1.0a2"
description = "Official Python SDK for SMSPVA SMS activation, phone number rental and private email APIs, with sync and async clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<1", "typing_extensions>=4.12"]
classifiers = ["Development Status :: 3 - Alpha", "Typing :: Typed", "Programming Language :: Python :: 3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smspva = ["py.typed", "_contracts.json"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/smspva"]

[tool.setuptools]
include-package-data = true

[project.urls]
Homepage = "https://smspva.com/"
Documentation = "https://docs.smspva.com"
Repository = "https://github.com/SMSPVA/smspva-python"
Issues = "https://github.com/SMSPVA/smspva-python/issues"
