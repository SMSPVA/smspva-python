name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Python package version to publish
        required: true
        default: 0.1.0a2
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert project['name'] == 'smspva-sdk'
          assert project['version'] == os.environ['RELEASE_VERSION'], 'Version differs from pyproject.toml'
          assert project['license'] == 'MIT'
          PY
      - run: python -m pip install --upgrade build twine mypy
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel
        run: python -m pip install dist/*.whl
      - name: Test the installed package
        run: python -m unittest discover -s tests -v
      - run: python -m mypy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/smspva-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-dist
          path: dist/
      - name: Publish checked distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
